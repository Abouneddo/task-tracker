<!-- Inside your Task Creation/Edit Modal -->
<div class="form-group">
  <label for="due_date">Due Date:</label>
  <input type="date" id="due_date" name="due_date" class="form-control">
</div>

<!-- Inside your Filter Bar -->
<div class="filter-group">
  <label>
    <input type="checkbox" id="overdue_filter"> Overdue Only
  </label>
</div>

<div class="form-group">
  <label for="tags">Tags (comma-separated):</label>
  <input type="text" id="tags" placeholder="urgent, work, dev" class="form-control">
</div>
